name: Rename to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          if [ -f gym-fitness-website.html ]; then
            git config user.name "mariamumtaz318-design"
            git config user.email "mariamumtaz318-design@users.noreply.github.com"
            git mv gym-fitness-website.html index.html
            git commit -m "Rename gym-fitness-website.html to index.html"
            git push
          fi
